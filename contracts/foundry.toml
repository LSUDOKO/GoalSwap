[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200

evm_version = "shanghai"

# Test profile
[profile.test]
solc_version = "0.8.24"
evm_version = "shanghai"
via_ir = true

# RPC endpoints for deployment
[rpc_endpoints]
xlayer-mainnet = "https://rpc.xlayer.tech"
xlayer-testnet = "https://testrpc.xlayer.tech/terigon"

# Etherscan-API verification (optional)
[etherscan]
xlayer-mainnet = { key = "${ETHERSCAN_API_KEY}" }
xlayer-testnet = { key = "${ETHERSCAN_API_KEY}" }